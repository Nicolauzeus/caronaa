name: CARONAA Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm install --global npm@11
          rm package-lock.json
          npm install --no-audit --no-fund
      - name: Payment policy and route tests
        run: npx vitest run src/lib/payments src/components/caronaa/LiveRideMap.test.ts
      - name: Full regression suite
        run: npm test
      - name: Build
        run: npm run build
