name: Research quality checks
on:
  push:
    branches: [main]
    paths:
      - "src/lib/formulario/**"
      - "src/components/admin/Research**"
      - "src/components/research/**"
      - "src/routes/pesquisas/**"
      - "src/routes/admin/formularios/**"
      - "drizzle/migrations/00**"
      - ".github/workflows/research-quality.yml"
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test -- src/lib/formulario/research-templates.test.ts src/lib/formulario/research-schema.test.ts src/lib/formulario/research-branding.test.ts src/lib/formulario/research-participation.test.ts src/lib/formulario/research-option-labels.test.ts
      - run: npm run build
