name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/lib/native/foreground-location.ts'
      - 'src/lib/native-driver-location.server.ts'
      - 'src/test/native-foreground-location.test.ts'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
      - name: Validate native configuration
        run: npm run android:check
      - name: TypeScript and foreground-location regressions
        run: |
          npx tsc --noEmit
          npx vitest run src/test/native-foreground-location.test.ts src/test/android-capacitor-phase2.test.ts src/hooks/use-flash-driver-presence.test.ts src/lib/professional-radar-sql-policy.test.ts src/lib/professional-radar-diagnostics.test.ts
      - name: Build web app
        run: npm run build
      - name: Capacitor sync
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CARONAA-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
