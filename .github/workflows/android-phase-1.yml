name: CARONAA Android phase 1
on:
  push:
    branches: [feat/android-capacitor-phase-1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caronaa-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/feat/android-capacitor-phase-1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Synchronize dependency lockfiles on isolated branch
        run: |
          npm install --global npm@11
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          bun install --lockfile-only --ignore-scripts
          git add package-lock.json bun.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(android): synchronize Capacitor dependency lockfiles"
            git push origin HEAD:refs/heads/feat/android-capacitor-phase-1
          fi
      - name: Verify frozen npm install
        id: install
        run: npm ci --no-audit --no-fund
      - name: Check Android configuration and types
        if: always() && steps.install.outcome == 'success'
        run: npm run android:check
      - name: Web TypeScript
        if: always() && steps.install.outcome == 'success'
        run: npx tsc --noEmit
      - name: Web regression tests
        if: always() && steps.install.outcome == 'success'
        run: npm test
      - name: Existing web production build
        if: always() && steps.install.outcome == 'success'
        run: npm run build
      - uses: actions/setup-java@v4
        if: always() && steps.install.outcome == 'success'
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 34
        if: always() && steps.install.outcome == 'success'
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Compile Android debug app
        if: always() && steps.install.outcome == 'success'
        run: npm run android:build:debug
      - name: Verify Bun lockfile
        if: always() && steps.install.outcome == 'success'
        run: bun install --frozen-lockfile --lockfile-only --ignore-scripts
