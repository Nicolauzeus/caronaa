name: F07 Bun radar verification
on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/caronaa/ProfessionalAvailabilityPage.tsx"
      - "src/components/caronaa/ProfessionalRadarSync.tsx"
      - "src/lib/quick-rides/f07-radar-diagnostic.functions.ts"
      - "src/lib/professional-radar-sql-policy.test.ts"
      - "drizzle/migrations/0144_f07_radar_diagnostico_proprio.sql"
      - "drizzle/migrations/0145_f07_restaurar_descoberta_publica.sql"
      - "src/routes/_authenticated/disponibilidade-profissional.tsx"
      - "src/routes/_authenticated/home.tsx"
      - "src/components/caronaa/QuickRideExperience.tsx"
      - "src/lib/quick-rides/quick-ride.functions.ts"
      - "src/lib/quick-rides/quick-ride-errors.ts"
      - "src/lib/quick-rides/quick-ride-errors.test.ts"
      - "src/lib/quick-rides/quick-ride-0147-regression.test.ts"
      - "drizzle/migrations/0147_f07_quick_quote_verified_destination.sql"
      - "src/components/caronaa/GoogleHomeRideMap.tsx"
      - ".github/workflows/f07-bun-radar.yml"
  push:
    branches: [main]
    paths:
      - "src/components/caronaa/ProfessionalAvailabilityPage.tsx"
      - "src/lib/quick-rides/f07-radar-diagnostic.functions.ts"
      - ".github/workflows/f07-bun-radar.yml"

permissions:
  contents: read
jobs:
  bun-f07:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Full Vitest suite (Bun)
        run: bunx vitest run
      - name: Production build (Bun)
        run: bun run build
